context:
  version: "4.5"

package:
  name: rarfile
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/r/rarfile/rarfile-${{ version }}.tar.gz
    sha256: 7425d0afa180f0092db903abb1526a130b36858980aad90b3694f48e41420155

build:
  script: ${{ PYTHON }} -m pip install .
  noarch: python
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rarfile
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/markokr/rarfile
  summary: RAR archive reader for Python
  license: ISC
  license_file: LICENSE

extra:
  recipe-maintainers:
    - marcelotrevisani
