context:
  version: "4.4"

package:
  name: rarfile
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/r/rarfile/rarfile-${{ version }}.tar.gz
    sha256: b7d29d671223cdc80e8b992df212d152ad88e6c961d4426c3fb2fefe8dd86fdf

build:
  script: ${{ PYTHON }} -m pip install .
  noarch: python
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - rarfile
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  homepage: https://github.com/markokr/rarfile
  summary: RAR archive reader for Python
  license: ISC
  license_file: LICENSE

extra:
  recipe-maintainers:
    - marcelotrevisani
